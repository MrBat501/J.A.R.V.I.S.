<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glass" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#8FE3EE"/>
      <stop offset="55%" stop-color="#3FA9C9"/>
      <stop offset="100%" stop-color="#1F6FA8"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFF3FA"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FE3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8FE3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="20" fill="#0F1626"/>
  <circle cx="50" cy="50" r="46" fill="url(#halo)"/>

  <g transform="translate(50 50) scale(0.9)">
    <!-- marco (los puntales son lo que queda entre las ventanas) -->
    <circle r="46" fill="#1E2A47" stroke="#C9A24B" stroke-width="1.6"/>
    <circle r="42.5" fill="none" stroke="#C9A24B" stroke-opacity="0.35" stroke-width="0.5"/>

    <!-- ventanas de luz (izquierda y derecha en espejo) -->
    <g fill="url(#glass)">
      <!-- superior central (trapecio) -->
      <path d="M-11.5 -29.5 L11.5 -29.5 L15.7 -39.5 A42.5 42.5 0 0 0 -15.7 -39.5 Z"/>
      <!-- superiores laterales -->
      <path d="M19.2 -37.9 L15.2 -27.5 L32.4 -27.5 A42.5 42.5 0 0 0 19.2 -37.9 Z"/>
      <path d="M-19.2 -37.9 L-15.2 -27.5 L-32.4 -27.5 A42.5 42.5 0 0 1 -19.2 -37.9 Z"/>
      <!-- laterales sobre el puntal horizontal -->
      <path d="M39.9 -15.2 L32.9 -2.4 L42.4 -2.4 A42.5 42.5 0 0 0 39.9 -15.2 Z"/>
      <path d="M-39.9 -15.2 L-32.9 -2.4 L-42.4 -2.4 A42.5 42.5 0 0 1 -39.9 -15.2 Z"/>
      <!-- laterales bajo el puntal horizontal -->
      <path d="M42.4 3 L29.8 3 L19.2 21.5 L33.5 26.1 A42.5 42.5 0 0 0 42.4 3 Z"/>
      <path d="M-42.4 3 L-29.8 3 L-19.2 21.5 L-33.5 26.1 A42.5 42.5 0 0 1 -42.4 3 Z"/>
      <!-- inferiores -->
      <path d="M17 25.3 L30.5 29.6 A42.5 42.5 0 0 1 8 41.7 Z"/>
      <path d="M-17 25.3 L-30.5 29.6 A42.5 42.5 0 0 0 -8 41.7 Z"/>
    </g>

    <!-- banda luminosa del triángulo principal -->
    <path d="M-33 -22.5 L33 -22.5 L2.6 28 L-2.6 28 Z" fill="url(#glass)"/>
    <!-- poste inferior -->
    <path d="M-2.6 22 L2.6 22 L3.4 44 L-3.4 44 Z" fill="#1E2A47"/>

    <!-- triángulo oscuro interior -->
    <path d="M-20.8 -14.5 L21 -14.5 L0 25.5 Z" fill="#12313A" stroke="#12313A" stroke-width="3" stroke-linejoin="round"/>

    <!-- núcleo -->
    <path d="M-12.6 -6.8 L12.6 -6.8 L0 14.5 Z" fill="url(#core)" stroke="url(#core)" stroke-width="2" stroke-linejoin="round" filter="url(#softGlow)"/>
  </g>
</svg>
